name: Rift Rivals build check

on:
  push:
    branches: [main]
    paths:
      - "rift-rivals-project/**"
      - ".github/workflows/rift-rivals-build.yml"
  pull_request:
    paths:
      - "rift-rivals-project/**"
      - ".github/workflows/rift-rivals-build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Verify and build game
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rift-rivals-project
    steps:
      - name: Check out game
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: rift-rivals-project/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check source
        run: npx tsc --noEmit
      - name: Build production assets
        run: npm run build
